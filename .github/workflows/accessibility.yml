name: Accessibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # No dependency needs install scripts; never run them in CI.
      - run: npm ci --ignore-scripts
      # Fast static gate: oxlint + ESLint (eslint-plugin-jsx-a11y).
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the app and serves it with `vite preview`.
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 14
